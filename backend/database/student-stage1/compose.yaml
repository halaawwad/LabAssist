name: labassist-student-stage1
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: labassist_student
      POSTGRES_USER: labassist_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Hebron
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - student_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./tests:/labassist-tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
volumes:
  student_pgdata:

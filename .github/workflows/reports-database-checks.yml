name: Reports database

on:
  push:
    branches: [main, noor]
  pull_request:
    branches: [main, noor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: labassist_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d labassist_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: labassist_ci
      PGPASSWORD: ephemeral-ci-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local Docker configuration
        working-directory: backend/database/reports-stage4
        run: |
          mkdir -p secrets
          printf '%s' 'ephemeral-compose-check-only' > secrets/postgres_password.txt
          docker compose --env-file .env.example config --quiet
      - name: Build and verify prerequisite stages
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f backend/database/student-stage1/sql/01-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/student-stage1/sql/02-demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/student-stage1/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/supervisor-stage1/sql/03-supervisor-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/supervisor-stage1/sql/04-demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/supervisor-stage1/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/workshop-stage1/sql/05-workshop-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/workshop-stage1/sql/06-demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/workshop-stage1/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-work-stage2/sql/07-project-work-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-work-stage2/sql/08-demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-work-stage2/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-finance-stage3/sql/09-project-finance-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-finance-stage3/sql/10-demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/project-finance-stage3/tests/acceptance.sql
      - name: Add two-semester fixtures and reports
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/database/semester-demo/seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/semester-demo/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/reports-stage4/sql/11-reports-schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/reports-stage4/sql/12-demo-seed.sql
      - name: Reports acceptance and seed replay
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/database/reports-stage4/tests/acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/database/reports-stage4/tests/seed-replay.sql
      - name: Independent PostgreSQL connection races
        run: node backend/database/reports-stage4/tests/concurrency.mjs

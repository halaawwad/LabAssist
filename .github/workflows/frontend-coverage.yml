name: Frontend coverage
on:
  push:
    branches: [main, noor]
    paths:
      [
        "frontend/**",
        "shared/auth/**",
        "tools/frontend-quality/**",
        ".github/workflows/frontend-coverage.yml",
      ]
  pull_request:
    branches: [main, noor]
    paths:
      [
        "frontend/**",
        "shared/auth/**",
        "tools/frontend-quality/**",
        ".github/workflows/frontend-coverage.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/frontend-quality/package-lock.json
            frontend/student/package-lock.json
            frontend/supervisor/package-lock.json
            frontend/workshop/package-lock.json
      - run: npm ci --prefix tools/frontend-quality --ignore-scripts
      - run: npm ci --prefix frontend/student
      - run: npm ci --prefix frontend/supervisor
      - run: npm ci --prefix frontend/workshop
      - name: Resolve shared source dependencies
        run: ln -s "$PWD/frontend/student/node_modules" node_modules
      - name: Four-role account UI coverage
        run: npm test --prefix tools/frontend-quality
      - name: Existing role suite coverage baselines
        run: node tools/frontend-quality/run-role-coverage.cjs
      - name: Normalize source paths for Sonar
        run: node tools/frontend-quality/normalize-coverage.cjs
      - name: Check account-flow coverage and nonempty role reports
        run: node tools/frontend-quality/check-coverage.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            tools/frontend-quality/coverage/
            frontend/student/coverage/
            frontend/supervisor/coverage/
            frontend/workshop/coverage/
          if-no-files-found: error
          retention-days: 14
